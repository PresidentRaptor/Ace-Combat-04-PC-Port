# Release defaults; personal saves, controls and GPU caches are never bundled.
[graphics]
preset = 2
internal_resolution = 3
texture_filter = 0
ui_smooth = 1
hd_textures = 0
anisotropy = 8
deinterlace = 1
scale_filter = 2

[postfx]
fxaa = 1
sharpen = 0.10
brightness = 0
contrast = 1
gamma = 1
saturation = 1

[display]
window_mode = 0
fullscreen_type = 1
window_width = 1280
window_height = 720
aspect = 1
widescreen = 1
hud_layout = 2
present_mode = 0
show_fps = 0

[audio]
volume = 1
mute_in_background = 0
